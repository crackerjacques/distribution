# EmulationStation runs event scripts from /run/emulationstation/scripts/<event>.
d /run/emulationstation/scripts/reboot 0755 root root -
d /run/emulationstation/scripts/shutdown 0755 root root -
L /run/emulationstation/scripts/reboot/rotate-quit-fallback.sh - - - - /usr/lib/rg-rotate-support/rotate-quit-fallback.sh
L /run/emulationstation/scripts/shutdown/rotate-quit-fallback.sh - - - - /usr/lib/rg-rotate-support/rotate-quit-fallback.sh
