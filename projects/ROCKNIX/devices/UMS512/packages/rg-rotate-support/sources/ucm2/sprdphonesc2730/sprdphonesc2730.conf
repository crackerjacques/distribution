Syntax 6

# Speaker is hw:0,3 (FE_ST_FAST), mic hw:0,2 (FE_ST_CAPTURE_DSP). hw:0,0
# plays an octave low. The other card names alsa-lib may look up are symlinks
# to this file and HiFi.conf.

Comment "Anbernic RG Rotate (Unisoc UMS512 / SC2730)"

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Speaker playback and microphone capture"
}
