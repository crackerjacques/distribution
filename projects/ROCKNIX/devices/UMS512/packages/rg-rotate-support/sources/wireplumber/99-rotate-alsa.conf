# The VBC DMA wedges on PipeWire's default MMAP/S24_LE/1040-frame setup.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" }, { node.name = "~alsa_input.*" } ]
    actions = {
      update-props = {
        audio.format          = "S16LE"
        audio.rate            = 48000
        api.alsa.disable-mmap = true
        api.alsa.period-size  = 1280
        api.alsa.headroom     = 4096
      }
    }
  }
]
