# Root shell on the USB gadget serial port, started by 80-rotate-ttygs0.rules.
# Sorts after rocknix.conf to drop its debug-mode conditions.
# TTY setup is left off: on a gadget TTY it deadlocks PID 1 on /dev/console.
# Stop it before shutdown, or systemd-shutdown waits on the shell.
[Unit]
ConditionKernelCommandLine=
ConditionPathExists=
ConditionPathExists=/dev/ttyGS0
Conflicts=shutdown.target
Before=shutdown.target

[Service]
TTYPath=
TTYReset=no
TTYVHangup=no
StandardInput=null
StandardOutput=journal
StandardError=journal
RestartSec=1
ExecStart=
ExecStart=/bin/sh -c 'exec /bin/sh -i <>/dev/ttyGS0 >&0 2>&0'
