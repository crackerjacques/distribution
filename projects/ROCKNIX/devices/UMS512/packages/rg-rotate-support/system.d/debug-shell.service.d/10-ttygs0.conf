# ttyGS0 is the USB gadget serial port, the only console this board has, and
# it is created after sysinit, when debug-shell.service has already been
# skipped on its ConditionPathExists. 80-rotate-ttygs0.rules starts it again
# when the port appears.
#
# Keep systemd's TTY setup off the gadget TTY (the same as Armbian's
# serial-getty drop-in for this board): systemd-executor otherwise blocks in
# the pre-exec TTY setup while holding the lock on /dev/console, and PID 1
# deadlocks on that lock the first time it needs the console. The shell opens
# the port itself instead; as the session leader systemd made it, it gets the
# port as its controlling terminal.
[Service]
TTYPath=
TTYReset=no
TTYVHangup=no
StandardInput=null
StandardOutput=journal
StandardError=journal
RestartSec=1
ExecStart=
ExecStart=/bin/sh -c 'exec /bin/sh -i <>/dev/ttyGS0 >&0 2>&0'
