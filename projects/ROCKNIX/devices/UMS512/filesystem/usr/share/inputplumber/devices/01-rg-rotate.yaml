# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: Anbernic RG Rotate

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG Rotate

maximum_sources: 1

# The whole pad is one gpio-keys node; the input device takes the node name.
source_devices:
  - group: gamepad
    evdev:
      name: gpio-keys-gamepad
      handler: event*
    capability_map_id: rg_rotate_map

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
